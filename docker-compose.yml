name: flex-checking

# journaux des conteneurs plafonnés (3 fichiers de 10 Mo par service) : sans limite, ils remplissent le disque
x-journaux: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  logging: *journaux
  build:
    context: ./backend
    target: dev
  image: flex-checking-backend:dev  # une image partagée par django, celery et celery-beat
  env_file: .env
  environment:
    DB_HOST: mysql
    DB_PORT: "3306"
    REDIS_URL: redis://redis:6379/0
    # Emails de développement : capturés par Mailpit (http://localhost:8025), jamais envoyés sur Internet
    EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
    EMAIL_HOST: mailpit
    EMAIL_PORT: "1025"
    EMAIL_USE_TLS: "0"
    EMAIL_HOST_USER: ""
    EMAIL_HOST_PASSWORD: ""
  volumes:
    - ./backend:/app
    - ./shared:/shared:ro
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
    mailpit:
      condition: service_started

services:
  mysql:
    image: mysql:8.0
    logging: *journaux
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00", "--max-connections=300", "--binlog-expire-logs-seconds=604800"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # poste local seulement : la base n'est jamais exposée au réseau (Wi-Fi de la salle, réseau de l'école)
    ports: ["127.0.0.1:3307:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    logging: *journaux
    # poste local seulement : Redis n'a pas de mot de passe en développement
    ports: ["127.0.0.1:6380:6379"]

  # Boîte mail de test : interface http://localhost:8025, SMTP localhost:1025 (accessibles depuis ce poste seulement)
  mailpit:
    image: axllent/mailpit:v1.21.8
    logging: *journaux
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    environment:
      MP_MAX_MESSAGES: "2000"

  django:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    # poste local seulement : serveur de développement (DEBUG) ; les téléphones passent par le proxy HTTPS
    ports: ["127.0.0.1:8000:8000"]

  celery:
    <<: *backend
    command: celery -A config worker -l info --concurrency 2

  # tâches planifiées : relance des emails restés en attente, purge des exports et des erreurs anciennes
  celery-beat:
    <<: *backend
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  frontend:
    image: node:24-alpine
    logging: *journaux
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_PROXY: http://django:8000
    volumes:
      - ./frontend:/app
      - ./shared:/shared:ro
      - frontend-node-modules:/app/node_modules
    # développement : accessible depuis ce poste seulement (les téléphones passent par le proxy HTTPS)
    ports: ["127.0.0.1:5173:5173"]

  proxy:
    image: caddy:2-alpine
    logging: *journaux
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/certs:/certs:ro
    # 443 (flex-checking.localhost) : poste local seulement ; 8443 : réseau local, pour tester le scan sur téléphone
    ports: ["127.0.0.1:443:443", "8443:8443"]
    depends_on: [django, frontend]

volumes:
  mysql-data:
  frontend-node-modules:
